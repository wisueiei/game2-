<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>UNDERFALL — ครบรอบ 1 ปี 2 เดือน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#000;overflow:hidden;
    font-family:'Kanit','Tahoma','Leelawadee UI',sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  #frame{position:relative;overflow:hidden;background:#000}
  #cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
  #ui{position:absolute;inset:0;pointer-events:none;overflow:hidden}

  /* ---------- crt / vignette ---------- */
  #crt{position:absolute;inset:0;pointer-events:none;z-index:60;
    background:repeating-linear-gradient(to bottom,rgba(0,0,0,.18) 0px,rgba(0,0,0,.18) 1px,rgba(0,0,0,0) 2px,rgba(0,0,0,0) 4px);
    opacity:.5;mix-blend-mode:multiply}
  #vig{position:absolute;inset:0;pointer-events:none;z-index:61;
    background:radial-gradient(ellipse at center,rgba(0,0,0,0) 42%,rgba(4,6,14,.82) 100%)}
  #fade{position:absolute;inset:0;pointer-events:none;z-index:70;background:#000;opacity:0;
    transition:opacity 1.2s linear}

  /* ---------- ornate corners ---------- */
  .corner{position:absolute;z-index:47;width:calc(var(--u)*17px);image-rendering:pixelated;
    opacity:0;transition:opacity 1s ease;pointer-events:none}
  .corner.on{opacity:.9}
  #cTL{left:calc(var(--u)*4px);top:calc(var(--u)*4px)}
  #cTR{right:calc(var(--u)*4px);top:calc(var(--u)*4px);transform:scaleX(-1)}
  #cBL{left:calc(var(--u)*4px);bottom:calc(var(--u)*4px);transform:scaleY(-1)}
  #cBR{right:calc(var(--u)*4px);bottom:calc(var(--u)*4px);transform:scale(-1,-1)}

  /* ---------- title ---------- */
  #title{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:calc(var(--u)*7px);
    background:radial-gradient(ellipse at center,#0b0a16 0%,#000 70%);transition:opacity .9s ease}
  #title.hide{opacity:0;pointer-events:none}
  #tHeart{width:calc(var(--u)*23px);image-rendering:pixelated;
    filter:drop-shadow(0 0 calc(var(--u)*5px) #ff2f4a);animation:beat 1.15s ease-in-out infinite}
  @keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.22)}26%{transform:scale(1)}38%{transform:scale(1.14)}}
  #tMain{color:#fff;font-size:calc(var(--u)*16px);font-weight:600;letter-spacing:calc(var(--u)*1px);
    text-shadow:0 calc(var(--u)*2px) 0 #3a1420, 0 0 calc(var(--u)*12px) rgba(255,110,150,.45)}
  #tSub{color:#c9c3d6;font-size:calc(var(--u)*8px);text-align:center;line-height:1.7;min-height:calc(var(--u)*14px)}
  #tPress{color:#ffd94a;font-size:calc(var(--u)*8.5px);opacity:0;animation:blink 1.25s steps(1) infinite;
    text-shadow:0 0 calc(var(--u)*7px) rgba(255,217,74,.55)}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.15}}

  /* ---------- center narration ---------- */
  #center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:35;
    width:86%;text-align:center;color:#fff;font-size:calc(var(--u)*11px);font-weight:500;line-height:1.75;
    opacity:0;transition:opacity .85s ease, letter-spacing .85s ease;letter-spacing:calc(var(--u)*.6px);
    text-shadow:0 calc(var(--u)*1.5px) 0 #000, 0 0 calc(var(--u)*14px) rgba(190,200,255,.4);white-space:pre-line}
  #center.on{opacity:1;letter-spacing:0}

  /* ---------- dialog box ---------- */
  #dlg{position:absolute;left:50%;bottom:calc(var(--u)*11px);transform:translateX(-50%) translateY(calc(var(--u)*8px));
    width:calc(var(--u)*352px);min-height:calc(var(--u)*62px);z-index:45;
    background:linear-gradient(180deg,#05060c 0%,#000 100%);
    border:calc(var(--u)*2.5px) solid #fff;
    padding:calc(var(--u)*7px);display:flex;gap:calc(var(--u)*8px);align-items:flex-start;
    opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;
    box-shadow:0 0 calc(var(--u)*16px) rgba(120,160,255,.2), inset 0 0 calc(var(--u)*14px) rgba(60,90,160,.12)}
  #dlg.on{opacity:1;transform:translateX(-50%) translateY(0)}
  #dPort{width:calc(var(--u)*46px);height:calc(var(--u)*46px);flex:0 0 auto;
    image-rendering:pixelated;border:calc(var(--u)*1.5px) solid #46608f;
    box-shadow:0 0 calc(var(--u)*8px) rgba(90,150,220,.35)}
  #dBody{flex:1 1 auto;min-width:0;padding-top:calc(var(--u)*2px)}
  #dName{position:absolute;top:calc(var(--u)*-9px);right:calc(var(--u)*8px);
    background:#000;border:calc(var(--u)*2px) solid #ffd94a;color:#ffd94a;
    font-size:calc(var(--u)*8px);font-weight:600;line-height:1;
    padding:calc(var(--u)*2.5px) calc(var(--u)*6px);letter-spacing:calc(var(--u)*1px);
    text-shadow:0 0 calc(var(--u)*7px) rgba(255,217,74,.75)}
  #dText{color:#fff;font-size:calc(var(--u)*9.5px);line-height:1.6;min-height:calc(var(--u)*40px);
    text-shadow:0 calc(var(--u)*1px) 0 #000;white-space:pre-wrap;word-break:break-word}
  #dArrow{position:absolute;right:calc(var(--u)*8px);bottom:calc(var(--u)*4px);color:#fff;
    font-size:calc(var(--u)*8px);opacity:0;animation:blink .8s steps(1) infinite}
  #dArrow.on{opacity:1}

  /* ---------- choices ---------- */
  #choice{position:absolute;left:50%;bottom:calc(var(--u)*88px);transform:translateX(-50%);
    z-index:46;display:none;gap:calc(var(--u)*26px);align-items:center;justify-content:center}
  #choice.on{display:flex}
  .btn{position:relative;pointer-events:auto;cursor:pointer;
    background:#000;border:calc(var(--u)*2.5px) solid #fff;color:#fff;
    font-family:inherit;font-size:calc(var(--u)*11px);font-weight:600;
    padding:calc(var(--u)*7px) calc(var(--u)*24px) calc(var(--u)*7px) calc(var(--u)*30px);
    transition:all .12s linear;text-shadow:0 calc(var(--u)*1px) 0 #000}
  .btn .sel{position:absolute;left:calc(var(--u)*8px);top:50%;transform:translateY(-50%);
    width:calc(var(--u)*11px);image-rendering:pixelated;opacity:0;transition:opacity .1s}
  .btn.act{border-color:#ffd94a;color:#ffd94a;box-shadow:0 0 calc(var(--u)*14px) rgba(255,217,74,.4)}
  .btn.act .sel{opacity:1;animation:nudge .55s ease-in-out infinite alternate}
  @keyframes nudge{from{transform:translateY(-50%) translateX(0)}to{transform:translateY(-50%) translateX(calc(var(--u)*2px))}}

  /* ---------- prompts / hud ---------- */
  #prompt{position:absolute;left:50%;bottom:calc(var(--u)*26px);transform:translateX(-50%);z-index:44;
    color:#bfe6ff;font-size:calc(var(--u)*9px);opacity:0;transition:opacity .25s;
    background:rgba(0,4,12,.72);border:calc(var(--u)*1.5px) solid #6fbfe8;
    padding:calc(var(--u)*4px) calc(var(--u)*10px);text-shadow:0 0 calc(var(--u)*8px) rgba(120,200,255,.85)}
  #prompt.on{opacity:1;animation:blink 1s steps(1) infinite}
  #hud{position:absolute;left:calc(var(--u)*9px);top:calc(var(--u)*8px);z-index:44;color:#8d8aa0;
    font-size:calc(var(--u)*7px);line-height:1.6;opacity:0;transition:opacity .8s}
  #hud.on{opacity:.85}
  #endTip{position:absolute;left:50%;bottom:calc(var(--u)*22px);transform:translateX(-50%);z-index:72;
    color:#2e2e38;font-size:calc(var(--u)*7px);opacity:0;transition:opacity 2s}
  #endTip.on{opacity:1}

  /* ---------- touch pad ---------- */
  #pad{position:absolute;left:calc(var(--u)*10px);bottom:calc(var(--u)*10px);z-index:50;
    display:none;grid-template-columns:repeat(3,calc(var(--u)*26px));grid-template-rows:repeat(3,calc(var(--u)*26px));gap:calc(var(--u)*2px)}
  #pad.on{display:grid}
  .pk{pointer-events:auto;background:rgba(255,255,255,.09);border:calc(var(--u)*1.5px) solid rgba(255,255,255,.35);
    color:#fff;font-size:calc(var(--u)*9px);display:flex;align-items:center;justify-content:center;border-radius:calc(var(--u)*2px)}
  .pk:active{background:rgba(255,217,74,.35)}
  #padZ{position:absolute;right:calc(var(--u)*12px);bottom:calc(var(--u)*16px);z-index:50;display:none;
    pointer-events:auto;width:calc(var(--u)*40px);height:calc(var(--u)*40px);border-radius:50%;
    background:rgba(255,255,255,.09);border:calc(var(--u)*1.5px) solid rgba(255,255,255,.35);
    color:#fff;font-size:calc(var(--u)*10px);align-items:center;justify-content:center}
  #padZ.on{display:flex}
  #snd{position:absolute;right:calc(var(--u)*7px);top:calc(var(--u)*6px);z-index:55;pointer-events:auto;
    cursor:pointer;color:#6c6a7d;font-size:calc(var(--u)*8px);background:none;border:none;font-family:inherit}
  #snd:hover{color:#fff}
</style>
</head>
<body>
<div id="stage">
  <div id="frame">
    <canvas id="cv"></canvas>
    <div id="ui">
      <div id="center"></div>

      <div id="dlg">
        <img id="dPort" alt="">
        <div id="dBody"><div id="dText"></div></div>
        <div id="dName">???</div>
        <div id="dArrow">▼</div>
      </div>

      <div id="choice">
        <button class="btn" id="b0"><img class="sel" alt=""><span>เจ็บ</span></button>
        <button class="btn" id="b1"><img class="sel" alt=""><span>ไม่เจ็บ</span></button>
      </div>

      <div id="prompt">[ Z ] เก็บขวดแก้ว</div>
      <div id="hud"></div>

      <div id="pad">
        <div></div><div class="pk" data-k="w">W</div><div></div>
        <div class="pk" data-k="a">A</div><div></div><div class="pk" data-k="d">D</div>
        <div></div><div class="pk" data-k="s">S</div><div></div>
      </div>
      <div id="padZ">Z</div>

      <button id="snd" title="เปิด/ปิดเสียง (M)">♪ ON</button>

      <img class="corner" id="cTL" alt=""><img class="corner" id="cTR" alt="">
      <img class="corner" id="cBL" alt=""><img class="corner" id="cBR" alt="">

      <div id="title">
        <img id="tHeart" alt="">
        <div id="tMain"></div>
        <div id="tSub"></div>
        <div id="tPress">* กดปุ่มใดก็ได้ เพื่อเริ่ม *</div>
      </div>

      <div id="endTip">กด R เพื่อเริ่มใหม่</div>
      <div id="crt"></div>
      <div id="vig"></div>
      <div id="fade"></div>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

/* =========================================================
   0. SETUP
   ========================================================= */
const W = 400, H = 225;
const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d');
cv.width = W; cv.height = H; ctx.imageSmoothingEnabled = false;

const lc = document.createElement('canvas'); lc.width = W; lc.height = H;
const lctx = lc.getContext('2d'); lctx.imageSmoothingEnabled = false;

const $ = id => document.getElementById(id);
const frame=$('frame'), centerEl=$('center'), dlg=$('dlg'), dName=$('dName'),
      dText=$('dText'), dArrow=$('dArrow'), dPort=$('dPort'), choiceEl=$('choice'),
      b0=$('b0'), b1=$('b1'), promptEl=$('prompt'), hudEl=$('hud'),
      titleEl=$('title'), tMain=$('tMain'), tSub=$('tSub'), tPress=$('tPress'),
      fadeEl=$('fade'), padEl=$('pad'), padZ=$('padZ'), sndBtn=$('snd'),
      endTip=$('endTip'), tHeart=$('tHeart');

function resize(){
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  frame.style.width  = (W*s)+'px';
  frame.style.height = (H*s)+'px';
  document.documentElement.style.setProperty('--u', s);
}
addEventListener('resize', resize); resize();

const wait  = ms => new Promise(r => setTimeout(r, ms));
const clamp = (v,a,b) => v<a?a:(v>b?b:v);
const lerp  = (a,b,t) => a+(b-a)*t;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd = mulberry32(20240614);
const rr  = (a,b) => a + rnd()*(b-a);

/* ความมืดพื้นฐานของแมพ — ยิ่งเข้าใกล้ 1 ยิ่งมืดสนิท (ปรับตรงนี้ได้ถ้าอยากให้สว่าง/มืดกว่านี้) */
const AMBIENT = 0.952;

/* =========================================================
   1. PIXEL DRAWING HELPERS
   ========================================================= */
function pxEllipse(g, cx, cy, rx, ry, col){
  g.fillStyle = col;
  const R = Math.round(ry);
  for(let y=-R; y<=R; y++){
    const t = 1 - (y*y)/(ry*ry);
    if(t <= 0) continue;
    const w = Math.round(rx*Math.sqrt(t));
    if(w <= 0) continue;
    g.fillRect(Math.round(cx-w), Math.round(cy+y), w*2, 1);
  }
}
function pxPoly(g, pts, col){
  let minY=1e9, maxY=-1e9;
  for(const p of pts){ if(p[1]<minY)minY=p[1]; if(p[1]>maxY)maxY=p[1]; }
  g.fillStyle = col;
  for(let y=Math.floor(minY); y<=Math.ceil(maxY); y++){
    const xs=[];
    for(let i=0;i<pts.length;i++){
      const a=pts[i], b=pts[(i+1)%pts.length];
      if((a[1]<=y && b[1]>y) || (b[1]<=y && a[1]>y))
        xs.push(a[0] + (y-a[1])/(b[1]-a[1])*(b[0]-a[0]));
    }
    xs.sort((p,q)=>p-q);
    for(let i=0;i+1<xs.length;i+=2){
      const x0=Math.round(xs[i]), x1=Math.round(xs[i+1]);
      if(x1>x0) g.fillRect(x0,y,x1-x0,1);
    }
  }
}
function newCv(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d'); g.imageSmoothingEnabled=false; return [c,g]; }

/* ordered-dither tiles (Bayer 4x4) — ใช้ทำแสงแบบพิกเซลจริงๆ ไม่ใช่ gradient เนียน */
const BAYER = [0,8,2,10, 12,4,14,6, 3,11,1,9, 15,7,13,5];
function makeDither(lv, R, G, B){
  const [c,g] = newCv(4,4);
  const d = g.createImageData(4,4);
  for(let i=0;i<16;i++){
    if(BAYER[i] < lv){ d.data[i*4]=R; d.data[i*4+1]=G; d.data[i*4+2]=B; d.data[i*4+3]=255; }
  }
  g.putImageData(d,0,0);
  return c;
}
const DITHER_TILE = [], DITHER_DARK = [];
for(let lv=0; lv<=16; lv++){
  DITHER_TILE.push(makeDither(lv, 255,255,255));   // ใช้เจาะแสง (destination-out)
  DITHER_DARK.push(makeDither(lv, 4,6,12));        // ใช้ทาความมืดจริงๆ
}
const LPAT = DITHER_TILE.map(c => lctx.createPattern(c,'repeat'));
const BPAT = DITHER_TILE.map(c => ctx.createPattern(c,'repeat'));

/* =========================================================
   2. CHARACTER SPRITES
   ========================================================= */
const PAL = {
  k:'#140d14', H:'#eae7ee', h:'#b7b2c4', S:'#f6d2b3', s:'#d9a98c',
  E:'#3fc9b0', B:'#5d3123', b:'#3c1d15', G:'#e5b356',
  D:'#932f2f', d:'#601b1d', L:'#2b2330', O:'#6d4527', R:'#ff2f4a'
};
function buildSprite(rows, pal){
  const w = rows[0].length, h = rows.length;
  const [c,x] = newCv(w,h);
  const img = x.createImageData(w,h);
  for(let j=0;j<h;j++) for(let i=0;i<w;i++){
    const col = pal[rows[j][i]];
    if(!col) continue;
    const o = (j*w+i)*4;
    img.data[o  ] = parseInt(col.slice(1,3),16);
    img.data[o+1] = parseInt(col.slice(3,5),16);
    img.data[o+2] = parseInt(col.slice(5,7),16);
    img.data[o+3] = 255;
  }
  x.putImageData(img,0,0);
  return c;
}
function flipH(src){
  const [c,x] = newCv(src.width, src.height);
  x.translate(src.width,0); x.scale(-1,1); x.drawImage(src,0,0);
  return c;
}

const HAT_F = ['................','.......kkk......','......kBBBk.....','.....kBBBBBk....',
'....kBBBBBBBk...','...kGGGGGGGGGk..','..kBBBBBBBBBBBk.','.kkkkkkkkkkkkkk.'];
const FACE_F = ['....kHHHHHHk....','...kHHHHHHHHk...','...kHSSSSSSHk...',
'...kHSESSEsHk...','...kHSSSSSSHk...','....kHSSSSHk....'];
const FACE_B = ['....kHHHHHHk....','...kHHHHHHHHk...','...kHHHHHHHHk...',
'...kHHHHHHHHk...','...kHHHHHHHHk...','....kHHHHHHk....'];
const BODY_F = ['..kHHkDDDDkHHk..','..kHHkDGGDkHHk..','..kHkDDDDDDkHk..','...kDDDDDDDDk...',
'...kDdDDDDdDk...','...kDDDDDDDDk...','..kDDDDDDDDDDk..','..kddddddddddk..'];
const BODY_B = ['..kHHkDDDDkHHk..','..kHHkDDDDkHHk..','..kHkDDDDDDkHk..','...kDDDDDDDDk...',
'...kDDDDDDDDk...','...kDDDDDDDDk...','..kDDDDDDDDDDk..','..kddddddddddk..'];
const LEGS_F = [
['...kLLkkkkLLk...','...kLLk..kLLk...','...kOOk..kOOk...','...kkkk..kkkk...'],
['...kLLkkkkLLk...','...kLLkkkkLLk...','...kOOkkkkOOk...','...kkkkkkkkkk...']];
const HAT_S = ['................','......kkk.......','.....kBBBk......','....kBBBBBk.....',
'...kBBBBBBBk....','..kGGGGGGGGGk...','.kBBBBBBBBBBBk..','.kkkkkkkkkkkkk..'];
const FACE_S = ['...kHHHHHHk.....','..kHHHHHHHHk....','..kHHHSSSSk.....',
'..kHHHSESSk.....','..kHHHSSSSk.....','...kHHSSSk......'];
const BODY_S = ['..kHHkDDDDk.....','..kHHkDDDDk.....','...kHkDDDDk.....','....kDDDDDk.....',
'....kDdDDDk.....','....kDDDDDk.....','...kDDDDDDDk....','...kdddddddk....'];
const LEGS_S = [
['....kLLLLk......','....kLLkLLk.....','....kOOkOOk.....','....kkkkkkk.....'],
['....kLLLLk......','....kLLLLk......','...kOOkOOOk.....','...kkkkkkkk.....']];

const asm = (a,b,c,d) => a.concat(b,c,d);
const SPR = {
  front: [0,1].map(i => buildSprite(asm(HAT_F, FACE_F, BODY_F, LEGS_F[i]), PAL)),
  back : [0,1].map(i => buildSprite(asm(HAT_F, FACE_B, BODY_B, LEGS_F[i]), PAL)),
  right: [0,1].map(i => buildSprite(asm(HAT_S, FACE_S, BODY_S, LEGS_S[i]), PAL))
};
SPR.left = SPR.right.map(flipH);

/* ---------------------------------------------------------------
   HERO — ใช้สไปรท์ PNG 24x32 จาก assets/sprites/night-witch ถ้าโหลดได้
   ถ้าโหลดไม่ได้ (เปิดแบบ file:// บางเบราว์เซอร์ / ไม่มีโฟลเดอร์ assets)
   จะถอยไปใช้ตัวที่วาดด้วยโค้ด 16x26 อัตโนมัติ เกมไม่พัง
   --------------------------------------------------------------- */
const HERO = {
  w:16, h:26, ready:false,
  seq:[0,1,0,2],                    // idle → ก้าวซ้าย → idle → ก้าวขวา
  img:{
    front:[SPR.front[0], SPR.front[1], SPR.front[1]],
    back :[SPR.back[0],  SPR.back[1],  SPR.back[1]],
    left :[SPR.left[0],  SPR.left[1],  SPR.left[1]],
    right:[SPR.right[0], SPR.right[1], SPR.right[1]]
  }
};
(function loadHeroArt(){
  const DIRS=['front','back','left','right'], POSE=['idle','walk','walk2'];
  const base='assets/sprites/night-witch/night-witch-';
  const next={front:[],back:[],left:[],right:[]};
  let pending=DIRS.length*POSE.length, dead=false;
  DIRS.forEach(d => POSE.forEach((pz,i) => {
    const im=new Image();
    im.onload  = () => { next[d][i]=im; if(--pending===0 && !dead){
      HERO.img=next; HERO.w=24; HERO.h=32; HERO.ready=true; } };
    im.onerror = () => { dead=true; };
    im.src = base + d + '-' + pz + '-24x32.png';
  }));
})();

const HEART = buildSprite(['.kk...kk.','kRRk.kRRk','kRRRkRRRk','kRRRRRRRk',
'.kRRRRRk.','..kRRRk..','...kRk...','....k....'], PAL);

const TREE_TONE = [
  {out:'#080f0b', dk:'#13291b', md:'#1b3c25', lt:'#244f2f', hl:'#2f6c3c', tr:'#2a1d13', trl:'#3d2b1c', tro:'#0f0a07'},
  {out:'#06100d', dk:'#102a22', md:'#173a2e', lt:'#1f4d3c', hl:'#2a6f55', tr:'#25201a', trl:'#362d22', tro:'#0b0908'},
  {out:'#0a0d08', dk:'#1a2216', md:'#232e1c', lt:'#2e3b24', hl:'#3d4d2f', tr:'#302418', trl:'#443422', tro:'#100b07'}
];
function buildTree(seed){
  const R = mulberry32(seed*7919+13);
  const TW=46, TH=62, cx=TW/2, base=TH-2;
  const [c,g] = newCv(TW,TH);
  const P = TREE_TONE[seed % 3];
  const tw = 6 + ((R()*3)|0);
  const th = 20 + ((R()*8)|0);
  g.fillStyle=P.tro; g.fillRect(cx-tw/2-1, base-th, tw+2, th);
  g.fillStyle=P.tr;  g.fillRect(cx-tw/2,   base-th, tw,   th-1);
  g.fillStyle=P.trl; g.fillRect(cx-tw/2,   base-th, 2,    th-1);
  g.fillStyle=P.tr;
  g.fillRect(cx-tw/2-3, base-4, 3, 3); g.fillRect(cx+tw/2, base-4, 3, 3);
  g.fillStyle=P.tro;
  g.fillRect(cx-tw/2-4, base-2, 4, 2); g.fillRect(cx+tw/2, base-2, 4, 2);

  const blobs=[], top = base - th - 6, n = 5;
  blobs.push({x:cx, y:top, rx:13+R()*4, ry:10+R()*3});
  for(let i=0;i<n;i++){
    const a = (i/n)*6.283 + R()*0.6;
    const d = 8 + R()*5;
    blobs.push({x:cx+Math.cos(a)*d, y:top+Math.sin(a)*d*0.6, rx:8+R()*4, ry:6+R()*3});
  }
  for(const b of blobs) pxEllipse(g, b.x, b.y, b.rx+1.2, b.ry+1.2, P.out);
  for(const b of blobs) pxEllipse(g, b.x, b.y, b.rx, b.ry, P.dk);
  for(const b of blobs) pxEllipse(g, b.x-1, b.y-2, b.rx*0.76, b.ry*0.68, P.md);
  for(const b of blobs) pxEllipse(g, b.x-2, b.y-3.5, b.rx*0.40, b.ry*0.36, P.lt);
  g.fillStyle = P.hl;
  for(let i=0;i<14;i++){
    const b = blobs[(R()*blobs.length)|0];
    g.fillRect((b.x-b.rx*0.6+R()*b.rx*0.9)|0, (b.y-b.ry*0.7+R()*b.ry*0.8)|0, 1, 1);
  }
  return {cv:c, ax:cx, ay:base};
}
function buildBush(seed){
  const R = mulberry32(seed*104729+7);
  const [c,g] = newCv(26,18);
  const P = TREE_TONE[seed % 3];
  const blobs = [
    {x:13, y:12, rx:10+R()*2, ry:5+R()*2},
    {x: 8, y:13, rx: 6+R()*2, ry:4+R()*1},
    {x:18, y:13, rx: 6+R()*2, ry:4+R()*1}];
  for(const b of blobs) pxEllipse(g,b.x,b.y,b.rx+1,b.ry+1,P.out);
  for(const b of blobs) pxEllipse(g,b.x,b.y,b.rx,b.ry,P.dk);
  for(const b of blobs) pxEllipse(g,b.x-1,b.y-1.5,b.rx*0.7,b.ry*0.6,P.md);
  g.fillStyle=P.hl;
  for(let i=0;i<7;i++) g.fillRect((3+R()*20)|0, (7+R()*6)|0, 1, 1);
  return {cv:c, ax:13, ay:17};
}
function buildRock(seed){
  const R = mulberry32(seed*15485863+3);
  const w = 12+((R()*10)|0), h = 8+((R()*6)|0);
  const [c,g] = newCv(w+4, h+5);
  const cx=(w+4)/2, cy=h+1;
  pxEllipse(g, cx, cy, w/2+1, h/2+1, '#0d1018');
  pxEllipse(g, cx, cy, w/2,   h/2,   '#2b3040');
  pxEllipse(g, cx-1, cy-1.5, w/2*0.7, h/2*0.6, '#3b4256');
  pxEllipse(g, cx-2, cy-2.5, w/2*0.34, h/2*0.3, '#4c556d');
  g.fillStyle='#1d4a2e';
  for(let i=0;i<4;i++) g.fillRect((2+R()*w)|0, (cy+h/2-2+R()*2)|0, 1+(R()*2|0), 1);
  return {cv:c, ax:cx, ay:h+3};
}
function buildCrystal(seed){
  const R = mulberry32(seed*32452843+11);
  const [c,g] = newCv(24,30);
  pxEllipse(g, 12, 27, 10, 4, '#171233');   // rubble base
  pxEllipse(g, 12, 26, 8, 3, '#241b46');
  const hue = R() < 0.5;
  const C = hue
    ? {o:'#123a52', d:'#1d6b8e', m:'#38b6d6', l:'#9df0ff'}
    : {o:'#3a1552', d:'#6b2a9e', m:'#a95ede', l:'#f0c6ff'};
  function shard(x, y, w, hgt){
    const p = [[x,y-hgt],[x+w,y-hgt*0.62],[x+w,y],[x,y+2],[x-w,y],[x-w,y-hgt*0.62]];
    pxPoly(g, p.map(q=>[q[0],q[1]]), C.o);
    pxPoly(g, [[x,y-hgt+1],[x+w-1,y-hgt*0.6],[x+w-1,y-1],[x,y+1],[x-w+1,y-1],[x-w+1,y-hgt*0.6]], C.d);
    pxPoly(g, [[x,y-hgt+2],[x+w-2,y-hgt*0.55],[x,y-1],[x-w+2,y-hgt*0.55]], C.m);
    g.fillStyle = C.l;
    g.fillRect(x-1, y-hgt+3, 1, (hgt*0.55)|0);
    g.fillRect(x, y-hgt+2, 1, 2);
  }
  shard(12, 26, 5, 18);
  shard(6,  27, 3, 10);
  shard(18, 27, 3, 12);
  return {cv:c, ax:12, ay:29, glow:hue?'#6fd8ff':'#c79bff'};
}
function buildDeer(){
  const [c,g] = newCv(34,38);
  const CORE='#eafffb', MID='#86ecd7', EDGE='#2f9e89';
  g.fillStyle=EDGE;
  [[9,22],[13,22],[21,22],[25,22]].forEach(p => g.fillRect(p[0], p[1], 2, 13));
  pxEllipse(g, 17, 20, 9, 5.5, EDGE);
  pxEllipse(g, 17, 19, 8, 4.5, MID);
  pxEllipse(g, 16, 18, 5, 2.5, CORE);
  pxPoly(g, [[23,17],[27,9],[29,10],[25,18]], EDGE);
  pxPoly(g, [[24,16],[27,10],[28,10.5],[25,17]], MID);
  pxEllipse(g, 28, 8, 4, 2.6, EDGE);
  pxEllipse(g, 28, 8, 3, 1.8, MID);
  pxEllipse(g, 29, 7.5, 1.4, 0.9, CORE);
  g.fillStyle = MID;
  const antler = [[27,6,27,1],[27,1,24,0],[27,3,24,2],[29,6,31,1],[31,1,33,1],[30,3,32,2]];
  for(const [x0,y0,x1,y1] of antler){
    const st = Math.max(Math.abs(x1-x0), Math.abs(y1-y0)) || 1;
    for(let i=0;i<=st;i++) g.fillRect(Math.round(lerp(x0,x1,i/st)), Math.round(lerp(y0,y1,i/st)), 1, 1);
  }
  g.fillStyle = CORE;
  for(let i=0;i<10;i++) g.fillRect((8+rnd()*18)|0, (14+rnd()*10)|0, 1, 1);
  return {cv:c, ax:17, ay:35};
}

const A = { ac:null, master:null, musicGain:null, muted:false, noiseBuf:null,
            windSrc:null, windGain:null, musicTimer:null };
function initAudio(){
  if(A.ac) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;
  A.ac = new AC();
  A.master = A.ac.createGain(); A.master.gain.value = 0.55; A.master.connect(A.ac.destination);
  A.musicGain = A.ac.createGain(); A.musicGain.gain.value = 0.30; A.musicGain.connect(A.master);
  const len = A.ac.sampleRate * 2;
  A.noiseBuf = A.ac.createBuffer(1, len, A.ac.sampleRate);
  const d = A.noiseBuf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
}
function tone(freq, dur, type, vol, dest, slideTo){
  if(!A.ac || A.muted) return;
  const o=A.ac.createOscillator(), g=A.ac.createGain();
  o.type = type||'square'; o.frequency.value = freq;
  if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo), A.ac.currentTime+dur);
  g.gain.setValueAtTime(0.0001, A.ac.currentTime);
  g.gain.exponentialRampToValueAtTime(vol||0.12, A.ac.currentTime+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, A.ac.currentTime+dur);
  o.connect(g); g.connect(dest||A.master);
  o.start(); o.stop(A.ac.currentTime+dur+0.02);
}
function noise(dur, vol, freq, q){
  if(!A.ac || A.muted) return;
  const s=A.ac.createBufferSource(); s.buffer=A.noiseBuf;
  const f=A.ac.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq||800; f.Q.value=q||1;
  const g=A.ac.createGain();
  g.gain.setValueAtTime(vol||0.15, A.ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, A.ac.currentTime+dur);
  s.connect(f); f.connect(g); g.connect(A.master); s.start(); s.stop(A.ac.currentTime+dur);
}

function windStart(){
  if(!A.ac || A.windSrc) return;
  const s=A.ac.createBufferSource(); s.buffer=A.noiseBuf; s.loop=true;
  const f=A.ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=520;
  const g=A.ac.createGain(); g.gain.value=0.0001;
  g.gain.exponentialRampToValueAtTime(0.20, A.ac.currentTime+2.2);
  s.connect(f); f.connect(g); g.connect(A.master); s.start();
  A.windSrc=s; A.windGain=g;
}
function windStop(){
  if(!A.windGain) return;
  A.windGain.gain.exponentialRampToValueAtTime(0.0001, A.ac.currentTime+0.5);
  const s=A.windSrc; setTimeout(()=>{try{s.stop()}catch(e){}}, 700);
  A.windSrc=null; A.windGain=null;
}
const MELODY = [0,3,7,10,7,3,5,3, 0,3,7,12,10,7,3,-2];
let mi=0;
function musicTick(){
  if(!A.ac || A.muted) return;
  const root = 196, n = MELODY[mi % MELODY.length], f = root * Math.pow(2, n/12);
  tone(f*2, 1.5, 'triangle', 0.055, A.musicGain);
  if(mi % 8 === 0) tone(f/2, 3.4, 'sine', 0.075, A.musicGain);
  if(mi % 4 === 2) tone(f*3, 0.9, 'sine', 0.02, A.musicGain);
  mi++;
}
function musicStart(){ if(A.musicTimer) return; musicTick(); A.musicTimer=setInterval(musicTick, 760); }
sndBtn.onclick = e => { e.stopPropagation(); toggleMute(); };
function toggleMute(){
  A.muted = !A.muted;
  if(A.master) A.master.gain.value = A.muted ? 0 : 0.55;
  sndBtn.textContent = A.muted ? '♪ OFF' : '♪ ON';
}

const keys = Object.create(null);
let anyKeyHit = false;
let advanceResolve = null, typing = false, skipTyping = false;
let choiceOpen = false, choiceIdx = 0, choiceResolve = null;

function onAdvance(){
  if(!A.ac) initAudio();
  if(choiceOpen){ pickChoice(choiceIdx); return; }
  if(typing){ skipTyping = true; return; }
  if(state.nearBottle && !state.hasBottle && state.canMove){ doPickup(); return; }
  if(advanceResolve){ const r=advanceResolve; advanceResolve=null; r(); }
}
function waitAdvance(){ return new Promise(r => advanceResolve = r); }
function holdOrSkip(ms){
  return new Promise(r => {
    let done=false;
    const fin = () => { if(done) return; done=true; clearTimeout(t); if(advanceResolve===fin) advanceResolve=null; r(); };
    const t = setTimeout(fin, ms);
    advanceResolve = fin;
  });
}
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true; anyKeyHit = true;
  if(k===' '||k==='arrowup'||k==='arrowdown'||k==='arrowleft'||k==='arrowright') e.preventDefault();
  if(k==='m'){ toggleMute(); return; }
  if(k==='r' && state.scene==='end'){ location.reload(); return; }
  if(choiceOpen){
    if(k==='a'||k==='arrowleft')  moveChoice(-1);
    if(k==='d'||k==='arrowright') moveChoice(1);
  }
  if(k==='z'||k==='x'||k==='e'||k==='enter'||k===' ') onAdvance();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
addEventListener('blur', () => { for(const k in keys) keys[k]=false; });

$('ui').addEventListener('pointerdown', e => {
  if(e.target.closest('.btn') || e.target.closest('#pad') || e.target.closest('#snd') || e.target.id==='padZ') return;
  anyKeyHit = true; onAdvance();
});
padZ.addEventListener('pointerdown', e => { e.preventDefault(); anyKeyHit=true; onAdvance(); });
padEl.querySelectorAll('.pk').forEach(el => {
  const k = el.dataset.k;
  const on  = e => { e.preventDefault(); keys[k]=true; };
  const off = e => { e.preventDefault(); keys[k]=false; };
  el.addEventListener('pointerdown', on);
  ['pointerup','pointerleave','pointercancel'].forEach(ev => el.addEventListener(ev, off));
});
if(matchMedia('(pointer: coarse)').matches){ padEl.classList.add('on'); padZ.classList.add('on'); }

/* =========================================================
   6. TEXT ENGINE
   ========================================================= */
const COMBINING = /[ัิ-ฺ็-๎̀-ͯ]/;
function graphemes(str){
  const out=[];
  for(const ch of str){
    if(out.length && COMBINING.test(ch)) out[out.length-1] += ch;
    else out.push(ch);
  }
  return out;
}
async function say(text, opt){
  opt = opt || {};
  dlg.classList.add('on');
  dName.textContent = opt.name || '???';
  dArrow.classList.remove('on');
  const g = graphemes('* ' + text);
  let buf = '';
  typing = true; skipTyping = false;
  dText.textContent = '';
  for(let i=0;i<g.length;i++){
    if(skipTyping){ buf = g.join(''); break; }
    buf += g[i];
    dText.textContent = buf;
    if(g[i].trim()) blip();
    await wait(opt.speed || 34);
  }
  dText.textContent = g.join('');
  typing = false; skipTyping = false;
  dArrow.classList.add('on');
  await waitAdvance();
  dArrow.classList.remove('on');
}
function hideDlg(){ dlg.classList.remove('on'); }
async function narrate(text, hold){
  centerEl.textContent = text;
  centerEl.classList.add('on');
  await holdOrSkip(hold || (1400 + graphemes(text).length * 55));
  centerEl.classList.remove('on');
  await wait(760);
}
function renderChoice(){ b0.classList.toggle('act', choiceIdx===0); b1.classList.toggle('act', choiceIdx===1); }
function moveChoice(d){
  const n = clamp(choiceIdx + d, 0, 1);
  if(n!==choiceIdx){ choiceIdx=n; renderChoice(); sfxSelect(); }
}
function pickChoice(i){
  if(!choiceOpen) return;
  choiceOpen = false; choiceEl.classList.remove('on'); sfxSelect();
  const r = choiceResolve; choiceResolve = null;
  if(r) r(i);
}
b0.addEventListener('pointerdown', e=>{e.stopPropagation(); choiceIdx=0; renderChoice(); pickChoice(0);});
b1.addEventListener('pointerdown', e=>{e.stopPropagation(); choiceIdx=1; renderChoice(); pickChoice(1);});
b0.addEventListener('pointerenter', ()=>{ if(choiceOpen && choiceIdx!==0){choiceIdx=0;renderChoice();sfxSelect();} });
b1.addEventListener('pointerenter', ()=>{ if(choiceOpen && choiceIdx!==1){choiceIdx=1;renderChoice();sfxSelect();} });
function askChoice(){
  choiceIdx = 0; renderChoice(); choiceEl.classList.add('on'); choiceOpen = true;
  return new Promise(r => choiceResolve = r);
}

const MAPR = 430;
const trees=[], bushes=[], rocks=[], crystals=[], flowers=[], fireflies=[], slabs=[];

const bAng = rr(0.4, 1.2);
const BOTTLE = { x: Math.cos(bAng)*312, y: Math.sin(bAng)*298, t:0 };

(function genWorld(){
  function place(arr, x, y, spr){ arr.push({x, y, spr}); }

  // ต้นไม้ล้อมขอบแมพ = กำแพงที่เข้าไปไม่ได้
  for(let i=0;i<130;i++){
    const a = (i/130)*Math.PI*2 + rr(-0.025,0.025);
    const r = MAPR + rr(0, 52);
    place(trees, Math.cos(a)*r, Math.sin(a)*r, (rnd()*6)|0);
  }
  for(let i=0;i<48;i++){
    const a = rnd()*Math.PI*2, r = MAPR - rr(4, 50);
    place(trees, Math.cos(a)*r, Math.sin(a)*r, (rnd()*6)|0);
  }
  for(let i=0;i<34;i++){
    const a=rnd()*Math.PI*2, r=rr(115, MAPR-75);
    const x=Math.cos(a)*r, y=Math.sin(a)*r;
    if(Math.hypot(x-BOTTLE.x, y-BOTTLE.y) < 80) continue;
    place(trees, x, y, (rnd()*6)|0);
  }
  for(let i=0;i<70;i++){
    const a=rnd()*Math.PI*2, r=Math.sqrt(rnd())*(MAPR-20);
    place(bushes, Math.cos(a)*r, Math.sin(a)*r, (rnd()*3)|0);
  }
  for(let i=0;i<42;i++){
    const a=rnd()*Math.PI*2, r=Math.sqrt(rnd())*(MAPR-18);
    place(rocks, Math.cos(a)*r, Math.sin(a)*r, (rnd()*3)|0);
  }
  // ผลึกคริสตัลเกาะตามขอบ — ของแปลกปลอมที่ทำให้ ??? เข้ามาไม่ได้
  for(let i=0;i<26;i++){
    const a=(i/26)*Math.PI*2 + rr(-0.08,0.08), r=MAPR - rr(2,16);
    place(crystals, Math.cos(a)*r, Math.sin(a)*r, (rnd()*3)|0);
  }
  for(let i=0;i<5;i++){
    const a=rnd()*Math.PI*2, r=rr(150, MAPR-90);
    place(crystals, Math.cos(a)*r, Math.sin(a)*r, (rnd()*3)|0);
  }
  // แผ่นหินเก่าๆ กระจายเป็นทาง
  for(let i=0;i<64;i++){
    const a=rnd()*Math.PI*2, r=Math.sqrt(rnd())*(MAPR-30);
    slabs.push({x:Math.cos(a)*r, y:Math.sin(a)*r, w:7+((rnd()*9)|0), h:5+((rnd()*5)|0)});
  }
  // ดอกไม้เรืองแสง
  function cluster(cx, cy, n, spread){
    for(let i=0;i<n;i++){
      const a=rnd()*Math.PI*2, r=Math.sqrt(rnd())*spread;
      flowers.push({x:cx+Math.cos(a)*r, y:cy+Math.sin(a)*r,
        glow:0, cd:0, ph:rnd()*6.28, kind:(rnd()*3)|0, h:7+((rnd()*7)|0)});
    }
  }
  for(let i=0;i<18;i++){
    const a=rnd()*Math.PI*2, r=rr(60, MAPR-70);
    const cx=Math.cos(a)*r, cy=Math.sin(a)*r;
    if(Math.hypot(cx-BOTTLE.x, cy-BOTTLE.y) < 92) continue;
    cluster(cx, cy, 7+((rnd()*9)|0), rr(16,34));
  }
  cluster(30, 46, 10, 22);
  for(let i=0;i<28;i++){
    const a=(i/28)*Math.PI*2, r=rr(28,46);
    flowers.push({x:BOTTLE.x+Math.cos(a)*r, y:BOTTLE.y+Math.sin(a)*r,
      glow:0, cd:0, ph:rnd()*6.28, kind:(rnd()*3)|0, h:8+((rnd()*6)|0)});
  }
  cluster(BOTTLE.x, BOTTLE.y, 10, 18);

  for(let i=0;i<30;i++){
    const a=rnd()*Math.PI*2, r=Math.sqrt(rnd())*(MAPR-40);
    fireflies.push({x:Math.cos(a)*r, y:Math.sin(a)*r, a:rnd()*6.28,
      sp:rr(6,16), ph:rnd()*6.28, z:rr(6,20)});
  }
})();

/* ---- pre-render พื้นทั้งแมพครั้งเดียว ---- */
const GPAD = 90, GS = (MAPR+GPAD)*2;
const [groundCv, gg] = newCv(GS, GS);
(function paintGround(){
  const R = mulberry32(777);
  const O = GS/2;
  gg.fillStyle = '#04050b'; gg.fillRect(0,0,GS,GS);

  pxEllipse(gg, O, O, MAPR+16, MAPR+16, '#0a1410');
  pxEllipse(gg, O, O, MAPR+4,  MAPR+4,  '#0f2017');
  pxEllipse(gg, O, O, MAPR,    MAPR,    '#1a3624');

  // ดินเป็นหย่อมๆ
  for(let i=0;i<26;i++){
    const a=R()*6.283, r=Math.sqrt(R())*(MAPR-40);
    pxEllipse(gg, O+Math.cos(a)*r, O+Math.sin(a)*r, 26+R()*55, 18+R()*38,
      R()<0.5 ? '#182a1c' : '#1b2a1a');
  }
  for(let i=0;i<14;i++){
    const a=R()*6.283, r=Math.sqrt(R())*(MAPR-60);
    pxEllipse(gg, O+Math.cos(a)*r, O+Math.sin(a)*r, 20+R()*40, 13+R()*26, '#221d14');
  }
  // แผ่นหินเก่า
  for(const s of slabs){
    gg.fillStyle='#101a18'; gg.fillRect(O+s.x-1, O+s.y-1, s.w+2, s.h+2);
    gg.fillStyle='#2a3038'; gg.fillRect(O+s.x, O+s.y, s.w, s.h);
    gg.fillStyle='#343c46'; gg.fillRect(O+s.x, O+s.y, s.w, 1);
    gg.fillStyle='#1d3a27';
    for(let i=0;i<3;i++) gg.fillRect(O+s.x+((R()*s.w)|0), O+s.y+((R()*s.h)|0), 1, 1);
  }
  // texture หญ้า
  const GRASS = ['#1f3c28','#24492e','#1a3122','#2a5134','#172c1e'];
  for(let i=0;i<26000;i++){
    const a=R()*6.283, r=Math.sqrt(R())*MAPR;
    const x=(O+Math.cos(a)*r)|0, y=(O+Math.sin(a)*r)|0;
    gg.fillStyle = GRASS[(R()*GRASS.length)|0];
    gg.fillRect(x, y, 1, 1);
  }
  // กอหญ้า
  for(let i=0;i<3400;i++){
    const a=R()*6.283, r=Math.sqrt(R())*(MAPR-6);
    const x=(O+Math.cos(a)*r)|0, y=(O+Math.sin(a)*r)|0;
    const c = R()<0.4 ? '#2c5b38' : '#20452b';
    const h = 2+((R()*3)|0);
    gg.fillStyle=c; gg.fillRect(x, y-h, 1, h);
    gg.fillRect(x+2, y-h+1, 1, Math.max(1,h-1));
  }
  // ใบไม้ร่วง
  const LEAF = ['#4a2f1c','#553520','#3f2a18','#5c3a1e'];
  for(let i=0;i<900;i++){
    const a=R()*6.283, r=Math.sqrt(R())*(MAPR-8);
    gg.fillStyle = LEAF[(R()*LEAF.length)|0];
    gg.fillRect((O+Math.cos(a)*r)|0, (O+Math.sin(a)*r)|0, 1+((R()*2)|0), 1);
  }
  // ขอบแมพค่อยๆจมลงความมืด (dither สีเข้ม ไล่จากในออกนอก)
  for(let step=0; step<8; step++){
    const rIn = MAPR - 46 + step*8;
    gg.save();
    gg.beginPath();
    gg.moveTo(O + MAPR + GPAD, O);
    gg.arc(O, O, MAPR + GPAD, 0, Math.PI*2);
    gg.closePath();
    gg.moveTo(O + rIn, O);
    gg.arc(O, O, rIn, 0, Math.PI*2);
    gg.closePath();
    gg.fillStyle = gg.createPattern(DITHER_DARK[2 + step*2], 'repeat');
    gg.fill('evenodd');
    gg.restore();
  }
  gg.globalAlpha = 1;
})();

/* =========================================================
   9. RENDER HELPERS
   ========================================================= */
let camX=0, camY=0;
function px(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(Math.round(x),Math.round(y),w,h); }
const sx = wx => Math.round(wx - camX);
const sy = wy => Math.round(wy - camY);

function drawStar(x,y,s,col,core){
  x=Math.round(x); y=Math.round(y);
  if(s<=0){ px(x,y,1,1,core||col); return; }
  ctx.fillStyle=col;
  ctx.fillRect(x-s-1, y, s*2+3, 1);
  ctx.fillRect(x, y-s-1, 1, s*2+3);
  if(s>=1){ ctx.fillRect(x-1,y-1,3,3); }
  if(s>=2){ ctx.fillRect(x-2,y-1,1,3); ctx.fillRect(x+2,y-1,1,3);
            ctx.fillRect(x-1,y-2,3,1); ctx.fillRect(x-1,y+2,3,1); }
  ctx.fillStyle = core||'#fff';
  ctx.fillRect(x, y, 1, 1);
}
function blitSpr(spr, wx, wy){
  const X = sx(wx) - spr.ax, Y = sy(wy) - spr.ay;
  if(X < -spr.cv.width || X > W || Y < -spr.cv.height || Y > H) return;
  ctx.drawImage(spr.cv, X, Y);
}

/* ---- dithered lighting ---- */
/* แสง = ไล่เฉดเนียนเป็นแกน + โปรยดิเทอร์ทับบางๆ ให้ขอบเป็นพิกเซลจริง */
function holeD(x,y,r,s,fringe){
  if(r<=1 || s<=0) return;
  const g = lctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,    `rgba(255,255,255,${s})`);
  g.addColorStop(0.46, `rgba(255,255,255,${s*0.80})`);
  g.addColorStop(0.78, `rgba(255,255,255,${s*0.30})`);
  g.addColorStop(1,    'rgba(255,255,255,0)');
  lctx.fillStyle = g;
  lctx.beginPath(); lctx.arc(x,y,r,0,6.283); lctx.fill();
  const F = fringe === undefined ? 2 : fringe;
  for(let i=0;i<F;i++){
    lctx.globalAlpha = clamp(s*0.13, 0, 1);
    lctx.fillStyle = LPAT[6 + i*4];
    lctx.beginPath(); lctx.arc(x, y, r*(1 - i*0.13), 0, 6.283); lctx.fill();
  }
  lctx.globalAlpha = 1;
}
function bloomD(x,y,r,rgb,a){
  if(r<=1 || a<=0) return;
  const g = ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,    `rgba(${rgb},${a})`);
  g.addColorStop(0.42, `rgba(${rgb},${a*0.48})`);
  g.addColorStop(1,    `rgba(${rgb},0)`);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x,y,r,0,6.283); ctx.fill();
}

/* ---- flowers (อ้างอิงดอกไม้เรืองแสงกลางคืน) ---- */
function drawFlower(f, time){
  const X = sx(f.x), Y = sy(f.y);
  if(X<-14 || X>W+14 || Y<-22 || Y>H+14) return;
  const g = f.glow;
  const sway = Math.sin(time*1.5 + f.ph) * (1 + g*1.6);
  const hgt  = f.h * (0.72 + g*0.34);
  const bx   = X + Math.round(sway);
  const by   = Y - hgt;

  const stem = g>0.15 ? '#2c5f52' : '#17332c';
  for(let i=0;i<hgt;i++){
    const t=i/hgt;
    ctx.fillStyle = stem;
    ctx.fillRect(Math.round(X + sway*t), Y-i, 1, 1);
  }
  ctx.fillStyle = g>0.15 ? '#2f6b57' : '#16302a';
  ctx.fillRect(bx-3, by+Math.round(hgt*0.45), 3, 1);
  ctx.fillRect(bx+1, by+Math.round(hgt*0.62), 3, 1);
  if(f.kind===2){
    ctx.fillStyle = g>0.15 ? '#9c3d55' : '#3d2029';
    ctx.fillRect(bx+2, by-2, 1, 1); ctx.fillRect(bx+3, by-3, 1, 1);
    ctx.fillRect(bx+3, by-4, 1, 1); ctx.fillRect(bx+2, by-5, 1, 1);
  }
  // กลีบ
  const petal = g>0.1 ? '#1f4f6b' : '#14313f';
  ctx.fillStyle = petal;
  ctx.fillRect(bx-3, by, 2, 2); ctx.fillRect(bx+2, by, 2, 2);
  ctx.fillRect(bx-1, by+1, 3, 1);
  // ดวงไฟ
  const b = 0.24 + g*0.76;
  const cA = `rgb(${Math.round(lerp(60,190,b))},${Math.round(lerp(140,245,b))},${Math.round(lerp(170,255,b))})`;
  const cB = `rgb(${Math.round(lerp(90,235,b))},${Math.round(lerp(180,255,b))},${Math.round(lerp(200,255,b))})`;
  const rr_ = f.kind===0 ? 2 : 2.4;
  pxEllipse(ctx, bx, by-1, rr_, rr_, cA);
  pxEllipse(ctx, bx, by-1.5, rr_*0.5, rr_*0.5, cB);
  if(g > 0.45 && ((time*4 + f.ph)|0) % 3 === 0)
    drawStar(bx + (Math.sin(time*3+f.ph)*4|0), by-6, 0, cB, '#fff');
}

/* ---- bottle ---- */
function drawBottleSprite(X, Y, fl, held){
  const bob = held ? 0 : Math.round(Math.sin(BOTTLE.t*1.7)*1.5);
  Y += bob;
  if(!held){  // เงาสะท้อนบนพื้น
    ctx.globalAlpha = 0.22;
    pxEllipse(ctx, X, Y+3, 7, 2.5, '#3a6fa8');
    ctx.globalAlpha = 1;
  }
  const G_O='#16304a', G_B='#20455f', G_L='#7fb6cf';
  pxEllipse(ctx, X, Y-5, 6, 7, G_O);
  pxEllipse(ctx, X, Y-5, 5, 6, G_B);
  px(X-2, Y-13, 4, 3, G_O);
  px(X-1, Y-13, 3, 3, G_B);
  px(X-3, Y-15, 6, 2, '#3d2a1a');
  px(X-3, Y-16, 6, 1, '#5c4128');
  px(X-2, Y-16, 2, 1, '#7a5a3a');
  // ribbon
  px(X-5, Y-12, 10, 1, '#7d3a55');
  px(X-6, Y-12, 2, 2, '#9c4a6a'); px(X+4, Y-12, 2, 2, '#9c4a6a');
  // soul flame
  const f1 = `rgb(${Math.round(lerp(96,168,fl))},${Math.round(lerp(150,220,fl))},255)`;
  const f2 = `rgb(${Math.round(lerp(140,196,fl))},${Math.round(lerp(96,130,fl))},255)`;
  pxEllipse(ctx, X, Y-5, 3, 3.4, f2);
  pxEllipse(ctx, X, Y-6, 1.8, 2.2, f1);
  px(X, Y-9+Math.round(fl*1.5), 1, 2, f1);
  px(X-1, Y-8+Math.round(fl), 1, 1, f2);
  // sparkles inside
  for(let i=0;i<3;i++){
    const a = BOTTLE.t*1.4 + i*2.1;
    px(X+Math.round(Math.cos(a)*3), Y-5+Math.round(Math.sin(a)*4), 1, 1, '#dff0ff');
  }
  // glass highlight
  px(X-4, Y-9, 1, 4, G_L);
  px(X-3, Y-10, 1, 1, G_L);
}

/* =========================================================
   10. FALL SCENE
   ========================================================= */
const fallStreaks = [];
for(let i=0;i<70;i++) fallStreaks.push({x:rnd()*W, y:rnd()*H, l:rr(5,26), sp:rr(180,520), w:rnd()<.2?2:1});
const fallDebris = [];
for(let i=0;i<34;i++) fallDebris.push({x:rnd()*W, y:rnd()*H, sp:rr(60,180), r:rr(1,3), k:rnd()});
const fallStars = [];
for(let i=0;i<40;i++) fallStars.push({x:rnd()*W, y:rnd()*H, s:(rnd()*3)|0, ph:rnd()*6.28, sp:rr(20,60)});

function drawFall(dt, t){
  const p = state.fallBg;
  const top = `rgb(${Math.round(lerp(48,3,p))},${Math.round(lerp(38,4,p))},${Math.round(lerp(78,12,p))})`;
  const bot = `rgb(${Math.round(lerp(12,0,p))},${Math.round(lerp(8,0,p))},${Math.round(lerp(24,0,p))})`;
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, top); g.addColorStop(1, bot);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // ปากหลุมที่ตกลงมา — ค่อยๆหุบจนหาย
  const hr = lerp(58, 0, clamp(p*1.2,0,1));
  if(hr > 1){
    ctx.globalCompositeOperation='lighter';
    bloomD(W/2, -14 - p*40, hr, '175,190,255', 0.34*(1-p));
    ctx.globalCompositeOperation='source-over';
    ctx.globalAlpha = (1-p)*0.9;
    pxEllipse(ctx, W/2, -14 - p*40, hr*0.42, hr*0.34, '#c9d2ff');
    ctx.globalAlpha = 1;
  }
  // ดาวระยิบ
  for(const s of fallStars){
    s.y -= s.sp*dt; if(s.y < -4){ s.y = H+rnd()*30; s.x = rnd()*W; }
    const tw = 0.4 + 0.6*Math.abs(Math.sin(t*2.2 + s.ph));
    ctx.globalAlpha = tw * (1-p*0.75);
    drawStar(s.x, s.y, s.s, '#9fb0e8', '#ffffff');
  }
  ctx.globalAlpha = 1;
  // เส้นความเร็ว
  ctx.globalAlpha = 0.45;
  for(const s of fallStreaks){
    s.y -= s.sp*dt*(0.5+p*0.9);
    if(s.y < -s.l){ s.y = H + rnd()*40; s.x = rnd()*W; }
    px(s.x, s.y, s.w, s.l, p>0.6?'#241f38':'#544d72');
  }
  ctx.globalAlpha = 1;
  // เศษใบไม้/กลีบดอก
  for(const d of fallDebris){
    d.y -= d.sp*dt;
    if(d.y < -6){ d.y = H+rr(0,50); d.x = rnd()*W; d.k = rnd(); }
    const col = p>0.62 ? '#302b48' : (d.k<0.4 ? '#c98fb0' : (d.k<0.75 ? '#8a80b8' : '#6f6890'));
    const sw = Math.round(Math.sin(t*2+d.x)*1.5);
    px(d.x+sw, d.y, d.r, Math.max(1,d.r-1), col);
  }

  // ตัวละคร
  const cxp = W/2 + Math.sin(t*0.9)*20;
  const cyp = H/2 + Math.sin(t*1.7)*9;
  ctx.save();
  ctx.translate(cxp, cyp);
  ctx.rotate(Math.sin(t*1.15)*0.30 + 0.12);
  ctx.globalAlpha = lerp(1, 0.32, clamp((p-0.55)/0.45,0,1));
  ctx.drawImage(HERO.img.front[(t*7|0)%2], -(HERO.w>>1), -(HERO.h>>1));
  ctx.restore();
  ctx.globalAlpha = 1;

  if(rnd()<0.4) parts.push({x:cxp+rr(-7,7), y:cyp+rr(-7,7), vx:rr(-6,6), vy:rr(40,95),
    life:0, max:rr(0.5,1.2), s:(rnd()<0.3?1:0), col:'#c9b6ff', core:'#fff', kind:'trail'});
  for(let i=parts.length-1;i>=0;i--){
    const q=parts[i]; q.life+=dt;
    if(q.kind!=='trail'){ parts.splice(i,1); continue; }
    q.x+=q.vx*dt; q.y+=q.vy*dt;
    if(q.life>q.max){ parts.splice(i,1); continue; }
    ctx.globalAlpha = 1 - q.life/q.max;
    drawStar(q.x, q.y, q.s, q.col, q.core);
  }
  ctx.globalAlpha = 1;

  ctx.fillStyle = `rgba(0,0,0,${clamp(p*0.9,0,0.93)})`;
  ctx.fillRect(0,0,W,H);
}

/* =========================================================
   11. WORLD RENDER
   ========================================================= */
function drawWorld(dt, t){
  const tx = player.x - W/2, ty = player.y - H/2;
  camX = lerp(camX, tx, 1 - Math.pow(0.0008, dt));
  camY = lerp(camY, ty, 1 - Math.pow(0.0008, dt));
  if(state.shake>0){
    camX += rr(-1,1)*state.shake; camY += rr(-1,1)*state.shake;
    state.shake = Math.max(0, state.shake - dt*14);
  }

  // พื้น (pre-rendered)
  ctx.fillStyle = '#04050b'; ctx.fillRect(0,0,W,H);
  const gx = Math.round(camX + GS/2), gy = Math.round(camY + GS/2);
  const sxs = clamp(gx, 0, GS), sys = clamp(gy, 0, GS);
  const sw  = clamp(gx+W, 0, GS) - sxs, sh = clamp(gy+H, 0, GS) - sys;
  if(sw>0 && sh>0) ctx.drawImage(groundCv, sxs, sys, sw, sh, sxs-gx, sys-gy, sw, sh);

  // ดอกไม้ (อยู่ใต้ทุกอย่าง)
  for(const f of flowers) drawFlower(f, t);

  // ของที่ต้องเรียงตามความลึก
  const list = [];
  for(const o of rocks)    list.push({y:o.y, s:ROCK_SPR[o.spr],    x:o.x});
  for(const o of bushes)   list.push({y:o.y, s:BUSH_SPR[o.spr],    x:o.x});
  for(const o of crystals) list.push({y:o.y, s:CRYSTAL_SPR[o.spr], x:o.x, c:1});
  for(const o of trees)    list.push({y:o.y, s:TREES_SPR[o.spr],   x:o.x});
  if(state.bottleSpawned && !state.hasBottle) list.push({y:BOTTLE.y, fn:drawBottle});
  if(state.deer && state.deer.a > 0.02) list.push({y:state.deer.y, fn:drawDeer});
  list.push({y:player.y, fn:()=>{ drawShadow(); drawPlayer(); drawHeldBottle(); }});
  list.sort((a,b)=>a.y-b.y);
  for(const d of list){ if(d.fn) d.fn(); else blitSpr(d.s, d.x, d.y); }

  // เกลียวแสงเขียวตอนรักษา
  if(state.healFx > 0){
    const PX = sx(player.x), PY = sy(player.y);
    ctx.lineWidth = 1;
    for(let i=0;i<5;i++){
      const ph = state.healSpin + i*1.25;
      const yy = PY - 2 - ((state.healSpin*11 + i*6.5) % 28);
      const ry = 1.6 + Math.abs(Math.sin(ph))*3.4;
      const rx = 9 + Math.abs(Math.sin(ph*0.7))*7;
      const a  = state.healFx * (0.16 + 0.32*Math.abs(Math.sin(ph)));
      ctx.strokeStyle = `rgba(105,255,168,${a.toFixed(3)})`;
      ctx.beginPath(); ctx.ellipse(PX, yy, rx, ry, 0, 0, 6.283); ctx.stroke();
    }
    for(let i=0;i<4;i++){
      const ph = state.healSpin*1.7 + i*1.57;
      px(PX + Math.cos(ph)*13, PY - 13 + Math.sin(ph)*4.6, 1, 1, '#e2ffee');
    }
  }

  // อนุภาค
  for(const q of parts){
    const X=sx(q.x), Y=sy(q.y), k=1-q.life/q.max;
    if(q.kind==='spark' || q.kind==='heal'){
      ctx.globalAlpha = clamp(k,0,1) * (0.55 + 0.45*Math.abs(Math.sin(t*6 + (q.tw||0))));
      drawStar(X, Y, q.s, q.col, q.core);
    } else {
      ctx.globalAlpha = clamp(k,0,1) * (q.kind==='dust'?0.72 : q.kind==='smoke'?0.34 : 0.85);
      px(X, Y, Math.max(1, q.r|0), Math.max(1, q.r|0), q.col);
    }
  }
  ctx.globalAlpha = 1;

  // หิ่งห้อย
  for(const ff of fireflies){
    const X=sx(ff.x), Y=sy(ff.y-ff.z);
    if(X<-4||X>W+4||Y<-4||Y>H+4) continue;
    const tw = 0.25 + 0.75*Math.abs(Math.sin(t*1.8 + ff.ph));
    ctx.globalAlpha = tw*0.85;
    px(X, Y, 1, 1, '#ffe9a0');
    ctx.globalAlpha = 1;
  }

  // คลื่นกำแพงกั้น
  for(const rp of ripples){
    const k = 1 - rp.life/rp.max;
    ctx.strokeStyle = `rgba(168,120,255,${(k*0.7).toFixed(3)})`;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(sx(rp.x), sy(rp.y), rp.r0 + (1-k)*22, 0, 6.283); ctx.stroke();
    ctx.strokeStyle = `rgba(220,190,255,${(k*0.32).toFixed(3)})`;
    ctx.beginPath(); ctx.arc(sx(rp.x), sy(rp.y), rp.r0 + (1-k)*13, 0, 6.283); ctx.stroke();
  }

  /* ---------- LIGHT PASS (dithered) ---------- */
  lctx.globalCompositeOperation = 'source-over';
  lctx.clearRect(0,0,W,H);
  lctx.fillStyle = `rgba(3,4,12,${state.darkness})`;
  lctx.fillRect(0,0,W,H);
  lctx.globalCompositeOperation = 'destination-out';

  holeD(sx(player.x), sy(player.y)-Math.round(HERO.h*0.38), state.playerLightR, state.playerLightA, 3);
  for(const f of flowers){
    if(f.glow > 0.03) holeD(sx(f.x), sy(f.y)-4, 30 + f.glow*34, f.glow*0.88, 2);
  }
  let lit=0;
  for(const q of parts){
    if(lit > 22) break;
    const k = 1-q.life/q.max;
    if(q.kind==='spark'){ holeD(sx(q.x), sy(q.y), 22*k+8, 0.55*k, 1); lit++; }
    else if(q.kind==='heal'){ holeD(sx(q.x), sy(q.y), 13, 0.20*k, 0); lit++; }
  }
  for(const o of crystals){
    const X=sx(o.x), Y=sy(o.y);
    if(X>-30 && X<W+30 && Y>-30 && Y<H+30) holeD(X, Y-12, 24, 0.24, 1);
  }
  for(const ff of fireflies){
    const X=sx(ff.x), Y=sy(ff.y-ff.z);
    if(X>-8&&X<W+8&&Y>-8&&Y<H+8) holeD(X, Y, 12, 0.34, 0);
  }
  if(state.bottleSpawned && !state.hasBottle) holeD(sx(BOTTLE.x), sy(BOTTLE.y)-6, 80, 0.62, 2);
  if(state.healFx>0) holeD(sx(player.x), sy(player.y)-12, 62, 0.34*state.healFx, 2);
  if(state.dustT>0)  holeD(sx(player.x), sy(player.y)-6, 76*state.dustT, 0.55*state.dustT, 2);
  if(state.deer && state.deer.a>0.02)
    holeD(sx(state.deer.x), sy(state.deer.y)-16, 58, 0.66*state.deer.a, 2);

  lctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(lc, 0, 0);

  /* ---------- BLOOM ---------- */
  ctx.globalCompositeOperation = 'lighter';
  for(const f of flowers){
    if(f.glow > 0.03) bloomD(sx(f.x), sy(f.y)-5, 15+f.glow*11, '96,190,255', f.glow*0.10);
  }
  for(const o of crystals){
    const X=sx(o.x), Y=sy(o.y);
    if(X>-30 && X<W+30 && Y>-30 && Y<H+30)
      bloomD(X, Y-13, 14, '130,165,255', 0.085);
  }
  for(const ff of fireflies){
    const X=sx(ff.x), Y=sy(ff.y-ff.z);
    if(X>-8&&X<W+8&&Y>-8&&Y<H+8)
      bloomD(X, Y, 7, '255,220,120', 0.13*(0.3+0.7*Math.abs(Math.sin(t*1.8+ff.ph))));
  }
  if(state.bottleSpawned && !state.hasBottle) bloomD(sx(BOTTLE.x), sy(BOTTLE.y)-7, 28, '140,150,255', 0.26);
  if(state.hasBottle)
    bloomD(sx(player.x)+(player.face==='left'?-10:10), sy(player.y)-12, 32, '140,155,255', 0.26);
  if(state.healFx>0) bloomD(sx(player.x), sy(player.y)-13, 42, '90,255,160', 0.13*state.healFx);
  if(state.deer && state.deer.a>0.02)
    bloomD(sx(state.deer.x), sy(state.deer.y)-16, 32, '110,240,215', 0.24*state.deer.a);
  ctx.globalCompositeOperation = 'source-over';

  if(state.healFx > 0.02){ ctx.globalAlpha = 0.9; drawPlayer(); ctx.globalAlpha = 1; }

  if(state.flash > 0){
    ctx.fillStyle = `rgba(255,255,255,${clamp(state.flash,0,1)})`;
    ctx.fillRect(0,0,W,H);
    state.flash -= dt*2.2;
  }
}

function drawDeer(){
  const d = state.deer;
  ctx.globalAlpha = clamp(d.a,0,1);
  blitSpr(DEER_SPR, d.x, d.y);
  ctx.globalAlpha = 1;
}

/* =========================================================
   12. UPDATE
   ========================================================= */
function updateWorld(dt, t){
  BOTTLE.t += dt;
  player.idle = (Math.sin(t*2.2) > 0.6 && !state.canMove) ? 0 : 0;

  let dx=0, dy=0;
  if(state.canMove){
    if(keys['w']||keys['arrowup'])    dy -= 1;
    if(keys['s']||keys['arrowdown'])  dy += 1;
    if(keys['a']||keys['arrowleft'])  dx -= 1;
    if(keys['d']||keys['arrowright']) dx += 1;
  }
  if(dx||dy){
    const l = Math.hypot(dx,dy) || 1, sp = 64;
    player.x += dx/l*sp*dt;
    player.y += dy/l*sp*dt;
    state.distWalked += sp*dt;
    if(Math.abs(dx) > Math.abs(dy)) player.face = dx>0 ? 'right' : 'left';
    else                            player.face = dy>0 ? 'front' : 'back';
    player.animT += dt;
    if(player.animT > 0.15){ player.animT = 0; player.frame = (player.frame + 1) & 3; }
    player.bob = (player.frame & 1) ? 0 : -1;
  } else {
    player.frame = 0; player.animT = 0;
    player.bob = Math.sin(t*2.4) > 0.55 ? -1 : 0;   // หายใจเบาๆ ตอนยืนนิ่ง
  }

  const d = Math.hypot(player.x, player.y);
  if(d > MAPR){
    const a = Math.atan2(player.y, player.x);
    player.x = Math.cos(a)*MAPR; player.y = Math.sin(a)*MAPR;
    if(t - state.barrierCd > 0.45){
      state.barrierCd = t;
      ripples.push({x:player.x, y:player.y, r0:6, life:0, max:0.8});
      sfxBarrier();
    }
  }
  for(let i=ripples.length-1;i>=0;i--){
    ripples[i].life += dt;
    if(ripples[i].life > ripples[i].max) ripples.splice(i,1);
  }

  for(const f of flowers){
    if(f.cd > 0) f.cd -= dt;
    if(Math.hypot(f.x-player.x, f.y-player.y) < 12 && f.cd <= 0){
      f.cd = 3.4; f.glow = 1;
      spawnSpark(f.x, f.y-f.h, 4 + ((rnd()*4)|0));
      sfxSparkle();
    }
    if(f.glow > 0) f.glow = Math.max(0, f.glow - dt*0.11);
  }

  for(let i=parts.length-1;i>=0;i--){
    const q = parts[i];
    q.life += dt;
    if(q.life > q.max){ parts.splice(i,1); continue; }
    if(q.kind === 'heal'){
      q.a += q.spin*dt; q.oy -= 15*dt;
      q.x = q.ox + Math.cos(q.a)*q.rad;
      q.y = q.oy + Math.sin(q.a)*q.rad*0.35;
    } else {
      q.x += q.vx*dt; q.y += q.vy*dt;
      if(q.kind === 'spark'){ q.vy += 5*dt; q.vx *= (1 - dt*0.9); }
      if(q.kind === 'dust'){ q.vx *= (1-dt*2.1); q.vy *= (1-dt*1.8); q.vy += 8*dt; }
      if(q.kind === 'smoke'){ q.vx *= (1-dt*1.2); q.vy *= (1-dt*0.55); }
    }
  }

  for(const ff of fireflies){
    ff.a += rr(-1.6,1.6)*dt;
    ff.x += Math.cos(ff.a)*ff.sp*dt;
    ff.y += Math.sin(ff.a)*ff.sp*dt;
    ff.z += Math.sin(t*1.3 + ff.ph)*6*dt;
    const dd = Math.hypot(ff.x, ff.y);
    if(dd > MAPR-30) ff.a += Math.PI;
  }

  state.healSpin += dt*2.7;
  if(state.healFx > 0) state.healFx = Math.max(0, state.healFx - dt*0.55);
  if(state.dustT  > 0) state.dustT  = Math.max(0, state.dustT  - dt*0.5);

  if(state.deer){
    const D = state.deer;
    D.t += dt;
    D.a = D.t < 1.6 ? D.t/1.6 : (D.t > 5.2 ? Math.max(0, 1-(D.t-5.2)/2.2) : 1);
    if(D.t > 7.6) state.deer = null;
  }

  if(state.bottleSpawned && !state.hasBottle){
    const near = Math.hypot(player.x-BOTTLE.x, player.y-BOTTLE.y) < 24 && state.canMove;
    if(near !== state.nearBottle){
      state.nearBottle = near;
      promptEl.classList.toggle('on', near);
    }
  }
}

/* =========================================================
   13. LOOP
   ========================================================= */
let last = performance.now(), T = 0;
function loop(now){
  let dt = Math.min((now - last)/1000, 0.05); last = now;
  T += dt;
  ctx.clearRect(0,0,W,H);
  if(state.scene === 'fall') drawFall(dt, T);
  else if(state.scene === 'title' || state.scene === 'end'){ ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H); }
  else { updateWorld(dt, T); drawWorld(dt, T); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* =========================================================
   14. CINEMATICS
   ========================================================= */
function tween(ms, fn, ease){
  return new Promise(res => {
    const t0 = performance.now();
    (function step(now){
      const k = clamp((now - t0)/ms, 0, 1);
      fn(ease ? ease(k) : k);
      if(k < 1) requestAnimationFrame(step); else res();
    })(t0);
  });
}
const easeOut = k => 1 - Math.pow(1-k, 3);
const easeIO  = k => k<0.5 ? 2*k*k : 1 - Math.pow(-2*k+2,2)/2;

/* กวางวิญญาณ — เป็นแค่บรรยากาศ ไม่เกี่ยวกับเนื้อเรื่อง ลบทั้งฟังก์ชันได้เลยถ้าไม่ชอบ */
function summonDeer(){
  const a = rr(0, Math.PI*2), d = rr(66, 96);
  let x = player.x + Math.cos(a)*d, y = player.y + Math.sin(a)*d;
  if(Math.hypot(x,y) > MAPR-30){
    const b = Math.atan2(y,x);
    x = Math.cos(b)*(MAPR-30); y = Math.sin(b)*(MAPR-30);
  }
  state.deer = { x, y, t:0, a:0 };
  sfxDeer();
}

async function endScene(){
  fadeEl.style.transition = 'opacity 2.4s linear';
  fadeEl.style.opacity = 1;
  await wait(2600);
  state.scene = 'end';
  fadeEl.style.opacity = 0;
  showCorners(true);
  await wait(400);
  for(const line of FINALE){
    const hold = line.trim()==='. . .' ? 1100 : 1500 + graphemes(line).length*62;
    await narrate(line, hold);
  }
  await wait(600);
  if(A.musicTimer){ clearInterval(A.musicTimer); A.musicTimer = null; }
  if(A.musicGain) A.musicGain.gain.exponentialRampToValueAtTime(0.0001, A.ac.currentTime + 3);
  showCorners(false);
  fadeEl.style.transition = 'opacity 3.4s linear';
  fadeEl.style.opacity = 1;
  $('crt').style.opacity = 0;
  await wait(4200);
  endTip.classList.add('on');
}

async function story(){
  // index.html#skip = ข้ามฉากตกลงมา (ไว้เทสต์)
  if(/skip/i.test(location.hash)){
    titleEl.classList.add('hide');
    initAudio(); if(A.ac && A.ac.state==='suspended') A.ac.resume();
    musicStart(); await wait(400);
  } else {
    await titleScreen();
    await fallScene();
  }
  await landScene();

  await wait(400);
  for(const line of TALK1) await say(line);

  const pick = await askChoice();
  if(pick === 0){
    await say('โอเคงั้นอยู่นิ่งๆนะ');
    hideDlg();
    await healScene();
    await say('โอเคน่าจะดีขึ้นแล้วนะ');
    hideDlg();
    await standUp();
  } else {
    await say('โอเค งั้นเธอค่อยๆเดินมานะ');
    hideDlg();
    await standUp();
  }

  await say('เอ้า เค้าจะบอกวิธีเดินให้นะ');
  await say('w  คือเดินหน้า');
  await say('a  คือไปทางซ้าย');
  await say('s  คือถอยหลัง');
  await say('d  คือไปทางขวา');
  await say('ค่อยๆเดินมานะ อย่ารีบ. . . เค้ารอเธออยู่');
  hideDlg();

  hudEl.innerHTML = 'W A S D — เดิน<br>Z / คลิก — พูดคุย · เก็บของ<br>M — เสียง';
  hudEl.classList.add('on');
  setTimeout(()=>hudEl.classList.remove('on'), 11000);

  state.scene = 'explore';
  state.canMove = true;
  let deerDone = false;
  await new Promise(r => {
    const iv = setInterval(() => {
      if(!deerDone && state.distWalked > 270){ deerDone = true; summonDeer(); }
      if(state.distWalked > 620){ clearInterval(iv); r(); }
    }, 120);
  });
  state.canMove = false;

  for(const line of TALK2) await say(line);
  hideDlg();

  state.bottleSpawned = true;
  tone(300, 0.9, 'sine', 0.09, null, 700);
  spawnSpark(BOTTLE.x, BOTTLE.y-6, 16, '#b7c8ff');
  state.canMove = true;

  await new Promise(r => { onPickup = async () => { await pickupSequence(); r(); }; });

  await say('เก่งมากเลยย เห็นมั้ยสว่างขึ้นตั้งเยอะ');
  await say('เอาหละ. . . ตามเค้ามานะ');
  hideDlg();
  await wait(900);

  await endScene();
}

window.__G = { state, player, flowers, trees, parts, fireflies, crystals, groundCv, HERO,
               BOTTLE, spawnHeal, spawnSmoke, spawnSpark, summonDeer };
story();

})();
</script>
