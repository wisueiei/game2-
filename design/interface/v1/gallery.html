<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNDERFALL — Interface Contact Sheet</title><link rel="icon" href="data:,"><style>
*{box-sizing:border-box}body{margin:0;background:#0d111d;color:#eee6d6;font-family:Tahoma,system-ui,sans-serif;padding:30px}header{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:24px}h1{font-size:28px;font-weight:500;margin:0 0 8px}p{color:#a5a6bd;font-size:13px;line-height:1.8;margin:0}a{color:#91dfea}select{padding:9px;background:#171c2c;color:#eee6d6;border:1px solid #444c68}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}figure{margin:0;border:1px solid #444c68;background:#131928;padding:8px}img{width:100%;display:block;aspect-ratio:16/9;object-fit:contain;background:#080c17}figcaption{font-size:12px;line-height:1.6;margin:8px 3px 3px;display:flex;justify-content:space-between;gap:8px}.scope{font-size:10px;color:#ed86a2}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}header{align-items:start;flex-direction:column}}@media(max-width:500px){body{padding:18px}.grid{grid-template-columns:1fr}}
</style></head><body><header><div><h1>UNDERFALL · ทุกหน้าต่างของเรื่องเล่า</h1><p>ภาพจากพรีวิวจริง 56 หน้า/สถานะ · เป็น UI ไม่ใช่หลักฐานว่าเกมสร้างแล้ว<br><a href="preview.html">เปิดต้นแบบกดใช้งาน</a> · <a href="interface-handoff.md">คู่มือส่งต่อ</a></p></div><select id="filter" aria-label="เลือกหมวดภาพ"><option value="featured">หน้าสำคัญ</option><option value="all">ทั้งหมด56หน้า</option></select></header><main class="grid" id="gallery"></main><script>
(async()=>{const catalog=await(await fetch('screen-catalog.json')).json();const featured=['title','continue','history','inventory','phone','save','battle','dodge','shop','name','dialogue','settings'];const select=document.getElementById('filter');[...new Set(catalog.screens.map(s=>s.group))].forEach(group=>{const option=document.createElement('option');option.value=group;option.textContent=group;select.append(option);});function render(){const value=select.value;const screens=catalog.screens.filter(s=>value==='all'||value==='featured'&&featured.includes(s.id)||s.group===value);document.getElementById('gallery').innerHTML=screens.map(s=>`<figure><a href="preview.html#${s.id}"><img src="../../../output/playwright/interface/screens/${s.id}.png" alt="${s.title}" loading="eager"></a><figcaption><span>${String(s.number).padStart(2,'0')} · ${s.title}</span><span class="scope">${s.scope==='future-ui'?'ระบบอนาคต':'UI'}</span></figcaption></figure>`).join('');}select.addEventListener('change',render);render();})();
</script></body></html>
